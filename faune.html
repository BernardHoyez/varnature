<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faune — Flore et Faune du Var</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2e5339">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<header class="site-header">
  <div class="title-row">
    <span class="leaf">🌿</span>
    <h1>Flore et Faune du Var</h1>
  </div>
  <nav class="site-nav">
    <a href="index.html">Accueil</a>
    <a href="flore.html">Flore</a>
    <a href="faune.html" class="active">Faune</a>
    <a href="famille-vegetales.html">Familles végétales</a>
  </nav>
</header>

<main>
  <a class="back-link" href="index.html">&larr; Accueil</a>
  <input type="search" id="search" class="search-box" placeholder="Rechercher une espèce (nom vernaculaire ou latin)…">
  <span class="count-badge" id="count"></span>
  <ul class="species-list" id="list"></ul>
  <p class="empty-msg" id="empty" style="display:none;">Aucune espèce ne correspond à cette recherche.</p>
</main>

<footer class="site-footer">Flore et Faune du Var — version PWA (structure)</footer>

<script>
let allSpecies = [];

function render(filter) {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  const term = (filter || '').trim().toLowerCase();
  const filtered = term
    ? allSpecies.filter(s => s.name.toLowerCase().includes(term))
    : allSpecies;

  document.getElementById('count').textContent = filtered.length + ' / ' + allSpecies.length + ' fiches';
  list.innerHTML = '';
  empty.style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(s => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = 'fiche.html?type=faune&slug=' + encodeURIComponent(s.slug);
    a.textContent = s.name;
    li.appendChild(a);
    list.appendChild(li);
  });
}

fetch('data/faune.json')
  .then(r => r.json())
  .then(data => {
    allSpecies = data;
    render('');
  });

document.getElementById('search').addEventListener('input', e => render(e.target.value));

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js');
  });
}
</script>
</body>
</html>
